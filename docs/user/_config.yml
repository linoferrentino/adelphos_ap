# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Adelphos, the fractal trust network
email: lino.ferrentino@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Adelphos is a system that implements a distributed network of
  trusted users to exchange goods and services.
  It uses the Activity Pub protocol to exchange data and messages;
  the database itself is a simple key value store whose keys are URIs
  that can be also remote.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.adelphos.it" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  linoferrentino


repository: linoferrentino/adelphos_ap
repository_tree: master

text_skin: ocean # "default" (default), "dark", "forest", "ocean", "chocolate", "orange"
highlight_theme: tomorrow # "default" (default), "tomorrow", "tomorrow-night", "tomorrow-night-eighties", "tomorrow-night-blue", "tomorrow-night-bright"


## => Post
##############################
## excerpt
excerpt_separator: <!--more-->

## license
license: CC-BY-NC-4.0 # "CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-4.0", "CC-BY-ND-4.0"

## TOC
toc:
  selectors: # "h1,h2,h3" (default)

# Build settings
#theme: minima
mathjax: true
mermaid: true
theme: jekyll-text-theme
#plugins:
#  - jekyll-feed


## => Plugins
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji



